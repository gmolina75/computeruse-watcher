[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computeruse-watcher"
version = "0.1.0"
description = "Lightweight, OS-agnostic background agent that reports computer usage (boot, login, app focus, idle) to MQTT with a local SQLite offline cache."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "computeruse-watcher" }]
keywords = ["monitoring", "telemetry", "mqtt", "time-tracking", "cross-platform"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: No User-Input",
]

# Core runtime dependencies. Deliberately minimal ("ligero"):
#   paho-mqtt  -> MQTT transport (LWT, QoS 1, auto-reconnect)
#   psutil     -> cross-platform process/boot info (replaces native calls where possible)
#   pydantic   -> config + event validation
dependencies = [
    "paho-mqtt>=2.1,<3",
    "psutil>=5.9,<8",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Optional platform extras. The agent degrades gracefully without them:
# a missing native binding never crashes the daemon, it simply reports
# a narrower set of fields for that platform.
macos = ["pyobjc>=9.2"]
linux = ["python-xlib>=0.15"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
]
all = ["computeruse-watcher[macos,linux]"]

[project.scripts]
# Console entry point: `cuw run`, `cuw --version`
cuw = "cuw.cli:main"

[project.urls]
repository = "https://internal.example/company/computeruse-watcher"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Tooling configuration (advanced standard: reproducible lint/type/test)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "S101",  # assert is used in tests
    "S311",  # random is acceptable for client-id jitter / event ids we replace with uuid
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# psutil / paho ship incomplete stubs in places; be pragmatic there.
[[tool.mypy.overrides]]
module = ["paho.mqtt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["Xlib.*", "AppKit.*", "Quartz.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:paho.*",
]
